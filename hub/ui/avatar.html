<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrum · Crew avatar</title>
<style>body{margin:0;background:#000;color:#eee;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:28px;left:32px;pointer-events:none}h1{font-size:15px;font-weight:500;letter-spacing:.16em}p{color:#888;font-size:12px}#region{color:#91acd8}button{background:#000;color:#ccc;border:1px solid #444;padding:9px 16px;cursor:pointer}nav{position:absolute;bottom:28px;left:32px;right:32px;display:flex;gap:8px;flex-wrap:wrap}button[aria-pressed="true"]{border-color:#9dcee8;color:#d6eaff}#reset{margin-left:auto}@media(max-width:600px){header{left:18px;top:16px}nav{left:18px;bottom:16px}button{padding:8px;font-size:11px}}#details{position:absolute;right:28px;top:120px;width:210px;border-top:1px solid #34404e;padding-top:12px}#details p{line-height:1.6;color:#a9b5c2}#hover{color:#e7efff}@media(max-width:900px){#details{top:auto;bottom:110px;right:18px;width:180px;background:#000b;padding:8px}#details p{font-size:11px}}#pose-panel{position:absolute;top:165px;left:24px;width:228px;background:#05080bdd;padding:14px;border:1px solid #24303b;border-radius:4px;max-height:60vh;overflow:auto}summary{cursor:pointer;font-size:13px;color:#ced8e2}.presets{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0}.presets button{font-size:11px;padding:6px}#pose-controls label{display:grid;grid-template-columns:1fr 35px;gap:5px;margin:12px 0;font-size:11px;color:#9aaab9}#pose-controls input{grid-row:2;grid-column:1;width:100%;accent-color:#91acd8}#pose-controls output{grid-row:2;grid-column:2;text-align:right}@media(max-width:700px){#pose-panel{top:150px;left:12px;width:145px;padding:8px;max-height:45vh}#details{width:135px}#pose-controls label{font-size:10px}}
</style></head>
<body><header><h1>ASTRUM / CREW AVATAR</h1><p>Drag to rotate · Scroll to zoom · Select a body region</p><p id="region" aria-live="polite">No region selected</p><p id="hover"></p></header><details id="pose-panel" open><summary>Pose & flexibility</summary><div id="pose-controls"></div></details><aside id="details" aria-live="polite"></aside><nav aria-label="Body systems"><button data-view="overview">Overview</button><button data-view="heart">Heart</button><button data-view="breathing">Breathing</button><button data-view="ears">Ears</button><button data-view="head">Head</button><button data-view="resistance">Resistance</button><button data-view="aerobic">Aerobic</button><button id="reset">Reset view</button></nav><script type="module" src="/src/avatar/preview.ts"></script></body></html>
