<!doctype html>
<!--
  The packaged app's first page, shown while the hub starts (src/lib.rs).
  It is the hub's own loading screen (ui/src/Loading.tsx, loading.css, AstraMark.tsx OrbitLight, orbit.css):
  the mark dead centre at the same size on the same ground, with the light running round its ring, so the hub's
  page takes over without a jump. Drawn here by a few lines of script because this page loads before any of the hub's.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrum</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #0b0c0e; color: #f2f3f5; font: 14px -apple-system, "Segoe UI", system-ui, sans-serif; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; }
  #mark { display: block; width: 112px; height: auto; color: #f2f3f5; }
  .ring { fill: currentColor; fill-opacity: 0.6; stroke: none; }
  .cross { fill: currentColor; }
  .light path { fill: none; stroke: currentColor; stroke-dashoffset: 0; animation: lap 1.8s linear infinite; }
  @keyframes lap { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
  /* Under the mark, so the mark itself stays dead centre. */
  #status { position: absolute; top: calc(50% + 43px + 18px); left: 24px; right: 24px; margin: 0 auto; max-width: 560px; text-align: center; line-height: 1.5; color: #9aa0a8; }
  #status.error { color: #f2f3f5; }
  @media (prefers-reduced-motion: reduce) { .light path { animation: none; } }
</style>
</head>
<body>
<div id="loading">
  <svg id="mark" viewBox="0 0 88 68" aria-hidden="true" focusable="false"></svg>
  <p id="status" role="status" aria-live="polite">Starting the hub…</p>
</div>
<script>
  // The same numbers as ui/src/AstraMark.tsx: the ring's band, the orbit squashed back to a circle, the light's spans.
  (function () {
    const n = (v) => +v.toFixed(2);
    const ellipse = (a, b) => `M${n(-a)} 0a${n(a)} ${n(b)} 0 1 0 ${n(2 * a)} 0a${n(a)} ${n(b)} 0 1 0 ${n(-2 * a)} 0Z`;
    const band = ellipse(53.56, 10.01) + ellipse(36.44, 6.76);
    const orbit = 'M45 0A45 45 0 1 1 -45 0A45 45 0 1 1 45 0';
    const LIGHT = [[-40, 0, 0.08], [-30, 0, 0.1], [-22, 0, 0.13], [-15, 0, 0.17], [-9, 0, 0.24], [-4.5, 0.5, 0.4], [-2, 1, 0.8], [0, 2, 0.35], [0, 3.2, 0.15]];
    const GLOW = [[-10, 0, 0.35], [-4, 1.5, 0.7]];
    const light = (spans) => `<g clip-path="url(#band)"><g class="light" transform="scale(1 0.1869)">${spans.map(([from, to, o]) =>
      `<path d="${orbit}" pathLength="100" stroke-width="18" stroke-opacity="${o}" stroke-dasharray="0 ${50 + from} ${to - from} ${50 - to}"/>`).join('')}</g></g>`;
    document.getElementById('mark').innerHTML =
      `<defs><clipPath id="band"><path d="${band}" clip-rule="evenodd"/></clipPath>` +
      `<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter></defs>` +
      `<g transform="translate(43.33 33.8) rotate(142.38)"><path class="ring" d="${band}" fill-rule="evenodd"/>` +
      `<g filter="url(#glow)">${light(GLOW)}</g>${light(LIGHT)}</g>` +
      `<path class="cross" d="M34 11C34 7.13401 37.134 4 41 4H47C50.866 4 54 7.13401 54 11V57C54 60.866 50.866 64 47 64H41C37.134 64 34 60.866 34 57V11Z"/>` +
      `<path class="cross" d="M67 24C70.866 24 74 27.134 74 31V37C74 40.866 70.866 44 67 44H21C17.134 44 14 40.866 14 37V31C14 27.134 17.134 24 21 24H67Z"/>`;
  })();
  // The app calls this when the hub could not start (src/lib.rs): the words replace the status line.
  window.astrumStatus = (text) => {
    const el = document.getElementById('status');
    el.textContent = text;
    el.classList.add('error');
  };
</script>
</body>
</html>
