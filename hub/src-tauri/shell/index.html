<!doctype html>
<!-- The packaged app's first page, shown while the hub starts (src/lib.rs). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrum</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; color: #f5f5f7; font: 15px -apple-system, system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 24px; text-align: center; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.2em; margin: 0; }
  p { margin: 0; color: #a1a1a6; max-width: 560px; line-height: 1.5; }
  @media (prefers-reduced-motion: no-preference) { #status:not(.error) { animation: breathe 2.4s ease-in-out infinite; } }
  @keyframes breathe { 50% { opacity: 0.45; } }
  .error { color: #f5f5f7; }
</style>
</head>
<body>
<main>
  <h1>ASTRUM</h1>
  <p id="status" role="status" aria-live="polite">Starting the hub…</p>
</main>
<script>
  window.astrumStatus = (text) => {
    const el = document.getElementById('status');
    el.textContent = text;
    el.classList.add('error');
  };
</script>
</body>
</html>
